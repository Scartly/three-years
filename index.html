<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Ti ❤️</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap"
        rel="stylesheet">

</head>

<body>

    <!-- Fondo -->
    <div class="background">
        <div id="stars"></div>
    </div>

    <!-- Música -->
    <audio id="music" loop>
        <source src="jisamillas_sDofMwJf.mp3" type="audio/mpeg">
    </audio>

    <!-- Pantalla inicial -->
    <section id="home">

        <h1 class="title">
            Feliz 3 años ❤️
        </h1>

        <p class="subtitle">
            Tengo una carta para ti...
        </p>

        <!-- Sobre -->
        <div class="envelope" id="envelope">

            <div class="back"></div>

            <div class="letter">

                <div class="paper">

                    <h2>
                        Para el amor de mi vida ❤️
                    </h2>

                    <div id="typedText"></div>

                    <button id="next">
                        Ver nuestros recuerdos ❤️
                    </button>

                </div>

            </div>

            <div class="front"></div>

            <div class="flap"></div>

            <div class="seal">
                ❤
            </div>

        </div>

        <p class="click">
            Haz clic en el sobre
        </p>

    </section>

    <!-- Galería -->

    <section id="gallery">

        <h2>
            Nuestros recuerdos 📸
        </h2>

        <div class="photos">

            <img src="img/foto1.jpg">

            <img src="img/foto2.jpg">

            <img src="img/foto3.jpg">

        </div>

        <button id="love">
            Tengo algo más...
        </button>

    </section>

    <!-- Final -->

    <section id="final">

        <h1>
            Te amo muchísimo ❤️
        </h1>

        <p>

            Gracias por estos tres años.

            Gracias por cada sonrisa.

            Gracias por existir.

            Volvería a elegirte una y mil veces.

        </p>

        <button id="rain">
            ❤️
        </button>

    </section>

    <canvas id="canvas"></canvas>

    <script>
alert("HTML funcionando");
</script>

<script src="script.js"></script>
</body>

</html>
